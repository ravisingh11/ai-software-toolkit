# Guardrails v2 installer-owned workflow.
name: Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require configured command
        run: |
          if [[ -z "${GUARDRAILS_UNIT_TEST_COMMAND}" ]]; then
            echo "::error::GUARDRAILS_UNIT_TEST_COMMAND is not configured"
            exit 1
          fi
        env:
          GUARDRAILS_UNIT_TEST_COMMAND: ${{ vars.GUARDRAILS_UNIT_TEST_COMMAND }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup repository
        if: ${{ vars.GUARDRAILS_SETUP_COMMAND != '' }}
        working-directory: ${{ vars.GUARDRAILS_WORKING_DIRECTORY || '.' }}
        run: bash -euo pipefail -c "${GUARDRAILS_SETUP_COMMAND}"
        env:
          GUARDRAILS_SETUP_COMMAND: ${{ vars.GUARDRAILS_SETUP_COMMAND }}
      - name: Unit tests
        working-directory: ${{ vars.GUARDRAILS_WORKING_DIRECTORY || '.' }}
        run: bash -euo pipefail -c "${GUARDRAILS_UNIT_TEST_COMMAND}"
        env:
          GUARDRAILS_UNIT_TEST_COMMAND: ${{ vars.GUARDRAILS_UNIT_TEST_COMMAND }}
          GUARDRAILS_WORKING_DIRECTORY: ${{ vars.GUARDRAILS_WORKING_DIRECTORY }}
