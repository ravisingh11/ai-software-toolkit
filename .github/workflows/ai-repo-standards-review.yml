name: AI Repo Standards Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ai-repo-standards-review-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    name: AI Repo Standards Review
    if: ${{ vars.AI_REVIEW_COMMAND != '' }}
    runs-on: ubuntu-latest
    env:
      AI_REVIEW_COMMAND: ${{ vars.AI_REVIEW_COMMAND }}
      AI_REVIEW_ROLE: repo-standards
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run repository standards review adapter
        run: |
          set -euo pipefail
          mkdir -p .ai-review/results
          AI_REVIEW_RESULT=.ai-review/results/repo-standards.json bash -euo pipefail -c "${AI_REVIEW_COMMAND}"
          jq -e 'type == "object" and (.findings | type == "array")' .ai-review/results/repo-standards.json >/dev/null
