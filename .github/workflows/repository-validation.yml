# Guardrails v2 installer-owned workflow.
name: Validate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: repository-validation-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository:
    name: Validate / repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 .guardrails/validators/validate_repository.py

  standards-source:
    name: Validate / standards source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate engineering standards source repository
        if: ${{ hashFiles('tooling/validators/validate_repository.py') != '' }}
        run: python3 tooling/validators/validate_repository.py
      - name: Validate shared skills and focused tests
        if: ${{ hashFiles('tooling/validate-skills.py') != '' }}
        run: python3 tooling/validate-skills.py
  docs:
    name: Validate / docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 .guardrails/validators/validate_documentation.py --base-ref "${BASE_REF}" --head-ref "${HEAD_REF}"
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
  ground-truth:
    name: Validate / ground truth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 .guardrails/validate_ground_truth.py --policy .guardrails/ground-truth-ai.yaml
