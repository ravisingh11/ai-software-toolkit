# Proof installer-owned workflow.
name: Validate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: repository-validation-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository:
    name: Validate / repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate installed contracts
        id: validate
        run: python3 .proof/validators/validate_repository.py
        env:
          PROOF_MEASUREMENTS_FILE: ${{ runner.temp }}/proof-measurements-input.json
      # Optional, self-reported display counts: never changes this check's result.
      - name: Package self-reported measurements
        id: measurements
        if: ${{ always() && (steps.validate.outcome == 'success' || steps.validate.outcome == 'failure') }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OUTCOME: ${{ steps.validate.outcome }}
        run: |
          input="${RUNNER_TEMP}/proof-measurements-input.json"
          if [[ ! -f "${input}" ]]; then
            echo "No measurements file was written; the scorecard will show measurements as not collected."
            exit 0
          fi
          if python3 .proof/measurements.py package --control repository-validation --input "${input}" \
              --outcome "${OUTCOME}" --head-sha "${HEAD_SHA}" --output "${RUNNER_TEMP}/proof-measurements/proof-measurements.json"; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::Measurements were not packaged; the check result is unaffected."
          fi
      - name: Upload self-reported measurements
        if: ${{ always() && steps.measurements.outputs.present == 'true' }}
        # Optional display metadata: an upload failure must not change the check result.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proof-measurements-repository-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof-measurements/proof-measurements.json
          if-no-files-found: error
          retention-days: 7


  standards-source:
    name: Validate / standards source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate engineering standards source repository
        if: ${{ hashFiles('tooling/validators/validate_repository.py') != '' }}
        run: python3 tooling/validators/validate_repository.py
      - name: Validate shared skills and focused tests
        if: ${{ hashFiles('tooling/validate-skills.py') != '' }}
        run: python3 tooling/validate-skills.py
  docs:
    name: Validate / docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate documentation
        id: validate
        run: python3 .proof/validators/validate_documentation.py --base-ref "${BASE_REF}" --head-ref "${HEAD_REF}"
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          PROOF_MEASUREMENTS_FILE: ${{ runner.temp }}/proof-measurements-input.json
      # Optional, self-reported display counts: never changes this check's result.
      - name: Package self-reported measurements
        id: measurements
        if: ${{ always() && (steps.validate.outcome == 'success' || steps.validate.outcome == 'failure') }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OUTCOME: ${{ steps.validate.outcome }}
        run: |
          input="${RUNNER_TEMP}/proof-measurements-input.json"
          if [[ ! -f "${input}" ]]; then
            echo "No measurements file was written; the scorecard will show measurements as not collected."
            exit 0
          fi
          if python3 .proof/measurements.py package --control documentation-validation --input "${input}" \
              --outcome "${OUTCOME}" --head-sha "${HEAD_SHA}" --output "${RUNNER_TEMP}/proof-measurements/proof-measurements.json"; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::Measurements were not packaged; the check result is unaffected."
          fi
      - name: Upload self-reported measurements
        if: ${{ always() && steps.measurements.outputs.present == 'true' }}
        # Optional display metadata: an upload failure must not change the check result.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proof-measurements-docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof-measurements/proof-measurements.json
          if-no-files-found: error
          retention-days: 7
  ground-truth:
    name: Validate / ground truth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate ground truth
        id: validate
        run: python3 .proof/validate_ground_truth.py --policy .proof/ground-truth-ai.yaml
        env:
          PROOF_MEASUREMENTS_FILE: ${{ runner.temp }}/proof-measurements-input.json
      # Optional, self-reported display counts: never changes this check's result.
      - name: Package self-reported measurements
        id: measurements
        if: ${{ always() && (steps.validate.outcome == 'success' || steps.validate.outcome == 'failure') }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OUTCOME: ${{ steps.validate.outcome }}
        run: |
          input="${RUNNER_TEMP}/proof-measurements-input.json"
          if [[ ! -f "${input}" ]]; then
            echo "No measurements file was written; the scorecard will show measurements as not collected."
            exit 0
          fi
          if python3 .proof/measurements.py package --control repository-ground-truth --input "${input}" \
              --outcome "${OUTCOME}" --head-sha "${HEAD_SHA}" --output "${RUNNER_TEMP}/proof-measurements/proof-measurements.json"; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::Measurements were not packaged; the check result is unaffected."
          fi
      - name: Upload self-reported measurements
        if: ${{ always() && steps.measurements.outputs.present == 'true' }}
        # Optional display metadata: an upload failure must not change the check result.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proof-measurements-ground-truth-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof-measurements/proof-measurements.json
          if-no-files-found: error
          retention-days: 7
