# Guardrails v2 installer-owned workflow.
name: Dependabot Verification

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: dependabot-verification-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  verify:
    name: Dependabot Evidence Probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVENT_NAME: ${{ github.event_name }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref && format('refs/heads/{0}', github.event.pull_request.base.ref) || github.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TOKEN_CONFIGURED: ${{ secrets.SECURITY_SETTINGS_TOKEN != '' }}
    steps:
      - name: Verify platform controls and write run-bound evidence
        env:
          SETTINGS_TOKEN: ${{ secrets.SECURITY_SETTINGS_TOKEN }}
        run: |
          set -euo pipefail
          conclusion=skipped
          status=not_run
          reason="SECURITY_SETTINGS_TOKEN is not configured; Dependabot settings have NO RESULT."
          if [[ "${TOKEN_CONFIGURED}" == "true" ]]; then
            alerts=unknown
            updates=unknown
            if GH_TOKEN="${SETTINGS_TOKEN}" gh api "repos/${GITHUB_REPOSITORY}/vulnerability-alerts" >/dev/null 2>&1; then alerts=enabled; fi
            updates_response=""
            updates_error="${RUNNER_TEMP}/dependabot-updates-error"
            if updates_response="$(GH_TOKEN="${SETTINGS_TOKEN}" gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/automated-security-fixes" 2>"${updates_error}")"; then
              if updates="$(jq -ser '
                if length == 1
                  and ((.[0] | type) == "object")
                  and ((.[0].enabled | type) == "boolean")
                  and ((.[0].paused | type) == "boolean")
                then
                  if .[0].enabled == false then "disabled"
                  elif .[0].paused == true then "paused"
                  else "enabled"
                  end
                else "unknown"
                end
              ' <<<"${updates_response}" 2>/dev/null)"; then
                :
              else
                updates=unknown
              fi
            elif grep -Eq '(^|[^0-9])404([^0-9]|$)' "${updates_error}"; then
              updates=disabled
            fi
            if [[ "${alerts}" == "enabled" && "${updates}" == "enabled" ]]; then
              conclusion=success
              status=passed
              reason="Dependabot vulnerability alerts and automated security fixes are enabled."
            elif [[ "${updates}" == "disabled" || "${updates}" == "paused" ]]; then
              conclusion=failure
              status=failed
              reason="Dependabot vulnerability alerts=${alerts}; automated security fixes=${updates}."
            elif [[ "${alerts}" == "unknown" || "${updates}" == "unknown" ]]; then
              reason="GitHub did not expose all Dependabot settings to the supplied least-privilege token."
            else
              conclusion=failure
              status=failed
              reason="Dependabot vulnerability alerts=${alerts}; automated security fixes=${updates}."
            fi
          fi
          jq -n --arg run_id "${GITHUB_RUN_ID}" --arg event "${EVENT_NAME}" --arg base_sha "${BASE_SHA}" --arg base_ref "${BASE_REF}" --arg head_sha "${HEAD_SHA}" --arg repository "${GITHUB_REPOSITORY}" --arg status "${status}" --arg summary "${reason}" '{version:1,run_id:($run_id|tonumber),event:$event,base_sha:$base_sha,base_ref:$base_ref,head_sha:$head_sha,revision:$head_sha,repository:$repository,provider_id:"github-dependabot",status:$status,summary:$summary}' > "${RUNNER_TEMP}/guardrails-evidence.json"
      - name: Upload run-bound evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: guardrails-dependabot-${{ github.run_id }}
          path: ${{ runner.temp }}/guardrails-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish display check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(jq -r '.status' "${RUNNER_TEMP}/guardrails-evidence.json")"
          reason="$(jq -r '.summary' "${RUNNER_TEMP}/guardrails-evidence.json")"
          case "${status}" in
            passed) conclusion=success ;;
            failed) conclusion=failure ;;
            not_run) conclusion=skipped ;;
            *) echo "Invalid evidence status" >&2; exit 2 ;;
          esac
          details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          external_id="guardrails:dependabot:${GITHUB_RUN_ID}:${HEAD_SHA}"
          payload="$(jq -n --arg sha "${HEAD_SHA}" --arg conclusion "${conclusion}" --arg reason "${reason}" --arg details_url "${details_url}" --arg external_id "${external_id}" '{name:"Dependabot Verification",head_sha:$sha,status:"completed",conclusion:$conclusion,details_url:$details_url,external_id:$external_id,output:{title:"Dependabot Verification",summary:$reason}}')"
          printf '%s' "${payload}" | gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" --input - >/dev/null
          [[ "${status}" != "failed" ]]
