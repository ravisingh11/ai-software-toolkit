# Guardrails v2 installer-owned workflow.
name: Secret Scan

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: github-secret-protection-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  verify:
    name: Secret Scan Evidence Probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVENT_NAME: ${{ github.event_name }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref && format('refs/heads/{0}', github.event.pull_request.base.ref) || github.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TOKEN_CONFIGURED: ${{ secrets.SECURITY_SETTINGS_TOKEN != '' }}
    steps:
      - name: Verify platform controls and write run-bound evidence
        env:
          SETTINGS_TOKEN: ${{ secrets.SECURITY_SETTINGS_TOKEN }}
        run: |
          set -euo pipefail
          conclusion=skipped
          status=not_run
          reason="SECURITY_SETTINGS_TOKEN is not configured; GitHub Secret Protection has NO RESULT."
          if [[ "${TOKEN_CONFIGURED}" == "true" ]]; then
            if repository="$(GH_TOKEN="${SETTINGS_TOKEN}" gh api "repos/${GITHUB_REPOSITORY}" 2>"${RUNNER_TEMP}/settings-error")"; then
              secret_status="$(jq -r '.security_and_analysis.secret_scanning.status // empty' <<<"${repository}")"
              push_status="$(jq -r '.security_and_analysis.secret_scanning_push_protection.status // empty' <<<"${repository}")"
              if [[ -z "${secret_status}" || -z "${push_status}" ]]; then
                reason="GitHub did not expose both Secret Scanning settings to the supplied least-privilege token."
              elif [[ "${secret_status}" != "enabled" || "${push_status}" != "enabled" ]]; then
                conclusion=failure
                status=failed
                reason="Secret Scanning=${secret_status}; push protection=${push_status}."
              elif alerts="$(GH_TOKEN="${SETTINGS_TOKEN}" gh api "repos/${GITHUB_REPOSITORY}/secret-scanning/alerts?state=open&per_page=100" 2>"${RUNNER_TEMP}/alerts-error")"; then
                count="$(jq 'length' <<<"${alerts}")"
                if [[ "${count}" == "0" ]]; then
                  conclusion=success
                  status=passed
                  reason="Secret Scanning and push protection are enabled with no open alerts."
                else
                  conclusion=failure
                  status=failed
                  reason="GitHub reported ${count} open secret-scanning alert(s)."
                fi
              else
                reason="Secret-scanning alerts could not be verified with the supplied least-privilege token."
              fi
            else
              reason="GitHub security settings could not be verified with the supplied least-privilege token."
            fi
          fi
          jq -n --arg run_id "${GITHUB_RUN_ID}" --arg event "${EVENT_NAME}" --arg base_sha "${BASE_SHA}" --arg base_ref "${BASE_REF}" --arg head_sha "${HEAD_SHA}" --arg repository "${GITHUB_REPOSITORY}" --arg status "${status}" --arg summary "${reason}" '{version:1,run_id:($run_id|tonumber),event:$event,base_sha:$base_sha,base_ref:$base_ref,head_sha:$head_sha,revision:$head_sha,repository:$repository,provider_id:"github-secret-protection",status:$status,summary:$summary}' > "${RUNNER_TEMP}/guardrails-evidence.json"
      - name: Upload run-bound evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: guardrails-secret-protection-${{ github.run_id }}
          path: ${{ runner.temp }}/guardrails-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish display check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(jq -r '.status' "${RUNNER_TEMP}/guardrails-evidence.json")"
          reason="$(jq -r '.summary' "${RUNNER_TEMP}/guardrails-evidence.json")"
          case "${status}" in
            passed) conclusion=success ;;
            failed) conclusion=failure ;;
            not_run) conclusion=skipped ;;
            *) echo "Invalid evidence status" >&2; exit 2 ;;
          esac
          details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          external_id="guardrails:secret-protection:${GITHUB_RUN_ID}:${HEAD_SHA}"
          payload="$(jq -n --arg sha "${HEAD_SHA}" --arg conclusion "${conclusion}" --arg reason "${reason}" --arg details_url "${details_url}" --arg external_id "${external_id}" '{name:"GitHub Secret Scan",head_sha:$sha,status:"completed",conclusion:$conclusion,details_url:$details_url,external_id:$external_id,output:{title:"GitHub Secret Scan",summary:$reason}}')"
          printf '%s' "${payload}" | gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" --input - >/dev/null
          [[ "${status}" != "failed" ]]
