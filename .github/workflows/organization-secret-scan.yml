name: Organization Secret Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: organization-secret-scan-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  organization-scanner:
    name: Secret Scan / organization scanner
    if: ${{ vars.SECRET_SCAN_COMMAND != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SECRET_SCAN_COMMAND: ${{ vars.SECRET_SCAN_COMMAND }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Run organization secret scanner
        shell: bash
        run: bash -euo pipefail -c "${SECRET_SCAN_COMMAND}"
