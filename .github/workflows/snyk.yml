name: Snyk

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: snyk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Snyk Code
    needs: configuration
    if: ${{ needs.configuration.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
      - name: Scan source code with Snyk Code
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --severity-threshold=high --sarif-file-output=snyk-code.sarif
      - name: Upload Snyk Code results
        if: ${{ always() && hashFiles('snyk-code.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: snyk-code.sarif

  open-source:
    name: Snyk Open Source
    needs: configuration
    if: ${{ needs.configuration.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Detect dependency manifests
        id: manifests
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( \
            -name 'package.json' -o -name 'package-lock.json' -o \
            -name 'requirements.txt' -o -name 'pyproject.toml' -o \
            -name 'poetry.lock' -o -name 'go.mod' -o -name 'pom.xml' -o \
            -name 'build.gradle' -o -name 'Gemfile.lock' \
          \) -not -path './.git/*' -print -quit | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Snyk CLI
        if: ${{ steps.manifests.outputs.found == 'true' }}
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
      - name: Scan open-source dependencies
        if: ${{ steps.manifests.outputs.found == 'true' }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --severity-threshold=high --sarif-file-output=snyk-open-source.sarif
      - name: Report no dependency manifest
        if: ${{ steps.manifests.outputs.found != 'true' }}
        run: echo "No supported dependency manifest found; Snyk Open Source is not applicable to this repository revision."
      - name: Upload Snyk Open Source results
        if: ${{ always() && hashFiles('snyk-open-source.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: snyk-open-source.sarif

  configuration:
    name: Snyk Configuration
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Verify Snyk token
        id: check
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SNYK_TOKEN}" || "${SNYK_TOKEN}" == "GUARDRAILS_NOT_CONFIGURED" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Snyk is an ORANGE advisory control until SNYK_TOKEN is configured."
            echo "Replace the SNYK_TOKEN placeholder to activate Snyk Code and Snyk Open Source scans."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "SNYK_TOKEN is configured; provider-backed scans may run."
