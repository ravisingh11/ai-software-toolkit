# Proof installer-owned workflow. Manual, optional verification fixtures only.
name: Lifecycle Verification
run-name: "Lifecycle PR #${{ inputs.pull-request-number }} @${{ inputs.revision }}"

on:
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: Open first-party pull request to verify.
        required: true
        type: string
      revision:
        description: Exact current 40-character pull request head SHA.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lifecycle-${{ github.repository }}-${{ inputs.pull-request-number }}
  cancel-in-progress: false

jobs:
  produce:
    name: Optional lifecycle producers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    outputs:
      image-artifact: ${{ steps.image.outputs.artifact-id }}
    steps:
      - name: Resolve trusted default branch and exact candidate
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pull-request-number }}
          REVISION: ${{ inputs.revision }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[1-9][0-9]*$ && "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY" > "$RUNNER_TEMP/repository.json"
          default_branch=$(jq -er .default_branch "$RUNNER_TEMP/repository.json")
          [[ "$GITHUB_REF" == "refs/heads/$default_branch" ]]
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/$default_branch" --jq .sha)
          [[ "$current" == "$WORKFLOW_SHA" ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" > "$RUNNER_TEMP/pull.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg revision "$REVISION" --arg base "$default_branch" '.state == "open" and .head.repo.full_name == $repo and .base.repo.full_name == $repo and .head.sha == $revision and .base.ref == $base' "$RUNNER_TEMP/pull.json"
          echo "base=$(jq -er .base.sha "$RUNNER_TEMP/pull.json")" >> "$GITHUB_OUTPUT"
      - name: Check out trusted runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out candidate data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          path: candidate
          persist-credentials: false
      - name: Install signature verifier
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        with:
          cosign-release: v2.6.0
      - name: Install verified Trivy
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          asset=trivy_0.76.0_Linux-64bit.tar.gz
          base=https://github.com/aquasecurity/trivy/releases/download/v0.76.0
          curl --fail --location --proto '=https' --tlsv1.2 -o "$asset" "$base/$asset"
          echo "e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7  $asset" | sha256sum --check --status
          curl --fail --location --proto '=https' --tlsv1.2 -o "$asset.sigstore.json" "$base/$asset.sigstore.json"
          cosign verify-blob "$asset" --bundle "$asset.sigstore.json" --certificate-oidc-issuer=https://token.actions.githubusercontent.com --certificate-identity='https://github.com/aquasecurity/trivy/.github/workflows/reusable-release.yaml@refs/tags/v0.76.0'
          mkdir -p "$RUNNER_TEMP/proof-bin"
          tar -xzf "$asset" -C "$RUNNER_TEMP/proof-bin" trivy
          echo "$RUNNER_TEMP/proof-bin" >> "$GITHUB_PATH"
      - name: Produce independent typed results
        env:
          PR: ${{ inputs.pull-request-number }}
          REVISION: ${{ inputs.revision }}
          BASE: ${{ steps.source.outputs.base }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 trusted/.proof/lifecycle_producers.py run \
            --source "$GITHUB_WORKSPACE/candidate" --config "$GITHUB_WORKSPACE/trusted/.proof/lifecycle.json" \
            --output "$RUNNER_TEMP/lifecycle" --repository "$GITHUB_REPOSITORY" --pr "$PR" \
            --head "$REVISION" --base "$BASE" --workflow-sha "$WORKFLOW_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload actual verification image
        id: image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: proof-lifecycle-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lifecycle/image.tar
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Bind image artifact metadata
        env:
          ARTIFACT_ID: ${{ steps.image.outputs.artifact-id }}
          ARCHIVE_DIGEST: ${{ steps.image.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          python3 trusted/.proof/lifecycle_producers.py finalize --output "$RUNNER_TEMP/lifecycle" \
            --artifact-id "$ARTIFACT_ID" --artifact-name "proof-lifecycle-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --archive-digest "sha256:${ARCHIVE_DIGEST#sha256:}"
      - name: Preserve candidate receipt and raw reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: proof-lifecycle-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lifecycle/*.json
            ${{ runner.temp }}/lifecycle/*.log
          retention-days: 7
          if-no-files-found: warn
  attest:
    name: Attest exact image and lifecycle receipt
    needs: produce
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      pull-requests: read
    steps:
      - name: Check out trusted verifier only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: proof-lifecycle-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: subject
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: proof-lifecycle-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports
      - name: Validate receipt and exact image before signing
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pull-request-number }}
          REVISION: ${{ inputs.revision }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" > "$RUNNER_TEMP/attest-pull.json"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, sys
          sys.path.insert(0, 'trusted/.proof')
          from lifecycle_contract import validate_receipt, digest
          receipt = json.loads(pathlib.Path('reports/lifecycle-receipt.json').read_text())
          config = json.loads(pathlib.Path('trusted/.proof/lifecycle.json').read_text())
          validate_receipt(receipt, config)
          pull = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'attest-pull.json').read_text())
          assert pull['head']['repo']['full_name'] == pull['base']['repo']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert pull['state'] == 'open' and pull['number'] == int(os.environ['PR'])
          assert receipt['repository'] == os.environ['GITHUB_REPOSITORY']
          assert receipt['head_sha'] == pull['head']['sha'] == os.environ['REVISION']
          assert receipt['base_sha'] == pull['base']['sha']
          assert receipt['workflow_sha'] == os.environ['WORKFLOW_SHA']
          assert receipt['run_id'] == int(os.environ['GITHUB_RUN_ID'])
          assert receipt['run_attempt'] == int(os.environ['GITHUB_RUN_ATTEMPT']) == 1
          assert receipt['config_sha'] == digest(config)
          value = hashlib.sha256()
          with pathlib.Path('subject/image.tar').open('rb') as stream:
              for chunk in iter(lambda: stream.read(1048576), b''):
                  value.update(chunk)
          assert receipt['artifact']['digest'] == 'sha256:' + value.hexdigest()
          PY
      - name: Attest both subjects in one statement
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            subject/image.tar
            reports/lifecycle-receipt.json
      - name: Publish signed receipt for scorecard collection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: proof-lifecycle-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/lifecycle-receipt.json
          retention-days: 7
          if-no-files-found: error
