# Proof installer-owned workflow.
name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: build-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require configured command
        run: |
          if [[ -z "${PROOF_BUILD_COMMAND}" ]]; then
            echo "::error::PROOF_BUILD_COMMAND is not configured"
            exit 1
          fi
        env:
          PROOF_BUILD_COMMAND: ${{ vars.PROOF_BUILD_COMMAND }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup repository
        if: ${{ vars.PROOF_SETUP_COMMAND != '' }}
        working-directory: ${{ vars.PROOF_WORKING_DIRECTORY || '.' }}
        run: bash -euo pipefail -c "${PROOF_SETUP_COMMAND}"
        env:
          PROOF_SETUP_COMMAND: ${{ vars.PROOF_SETUP_COMMAND }}
      - name: Build
        working-directory: ${{ vars.PROOF_WORKING_DIRECTORY || '.' }}
        run: bash -euo pipefail -c "${PROOF_BUILD_COMMAND}"
        env:
          PROOF_BUILD_COMMAND: ${{ vars.PROOF_BUILD_COMMAND }}
          PROOF_WORKING_DIRECTORY: ${{ vars.PROOF_WORKING_DIRECTORY }}
