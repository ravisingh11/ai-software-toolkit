# Guardrails v2 installer-owned workflow.
name: Guardrail Scorecard Badge

on:
  workflow_run:
    workflows: [Guardrail Scorecard]
    types: [completed]
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: guardrails-scorecard-pages
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pull-requests: read
  pages: write
  id-token: write

jobs:
  publish:
    name: Publish Latest PR Scorecard
    if: >-
      ${{ vars.GUARDRAILS_SCORECARD_BADGE_ENABLED == 'true' &&
          vars.GUARDRAILS_SCORECARD_BADGE_PAGES_MODE == 'dedicated' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out trusted default-branch publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reconcile newest trustworthy PR scorecard
        id: reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          GUARDRAILS_SCORECARD_BADGE_PAGES_ACCESS: ${{ vars.GUARDRAILS_SCORECARD_BADGE_PAGES_ACCESS }}
        run: |
          set -euo pipefail
          python3 .guardrails/reconcile_scorecard_badge.py \
            --repository "${GITHUB_REPOSITORY}" \
            --repository-root "${GITHUB_WORKSPACE}" \
            --renderer "${GITHUB_WORKSPACE}/.guardrails/render_scorecard_badge.py" \
            --output-dir "${RUNNER_TEMP}/guardrails-pages" \
            --github-output "${GITHUB_OUTPUT}" \
            --job-summary "${GITHUB_STEP_SUMMARY}"
      - name: Configure dedicated GitHub Pages deployment
        if: ${{ steps.reconcile.outputs.publish == 'true' }}
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Upload bounded Pages artifact
        if: ${{ steps.reconcile.outputs.publish == 'true' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ steps.reconcile.outputs.output_dir }}
      - name: Deploy latest PR scorecard
        if: ${{ steps.reconcile.outputs.publish == 'true' }}
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
