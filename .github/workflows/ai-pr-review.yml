name: AI PR Review

# Four advisory AI reviewers (engineering, QA, security, repository standards)
# and a report-only consolidation job. Each role job runs the repository-owned
# AI_REVIEW_COMMAND from the pull request's base revision (`trusted/`) against
# the head revision (`candidate/`), so a pull request cannot change the code
# that receives ANTHROPIC_API_KEY. Dependencies install first, in a separate
# step without the key, through the optional AI_REVIEW_SETUP_COMMAND. No pull-request code runs in these jobs; the
# reviewer only reads the diff. The command receives AI_REVIEW_ROLE,
# AI_REVIEW_RESULT, AI_REVIEW_TARGET, AI_REVIEW_BASE_SHA, AI_REVIEW_HEAD_SHA,
# and AI_REVIEW_MODEL, and exits non-zero when it cannot complete the review or
# when unresolved P0/P1 findings remain. Every job is skipped until
# AI_REVIEW_COMMAND (or the workflow_call input review-command) is configured;
# a skipped check is never a pass. AI review is advisory-only and must not be a
# required status check.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      review-command:
        description: Trusted repository-owned AI review adapter command, run from the base revision.
        required: false
        type: string
        default: ''
      review-setup-command:
        description: Optional dependency setup, run from the base revision before the review step and without the provider key.
        required: false
        type: string
        default: ''
      review-working-directory:
        description: Directory inside the head revision whose changes are reviewed.
        required: false
        type: string
        default: '.'
    secrets:
      ANTHROPIC_API_KEY:
        required: false

concurrency:
  group: ai-pr-review-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  engineering:
    name: AI Engineering Review
    if: ${{ (inputs.review-command || vars.AI_REVIEW_COMMAND) != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AI_REVIEW_ROLE: engineering
      AI_REVIEW_COMMAND: ${{ inputs.review-command || vars.AI_REVIEW_COMMAND }}
      AI_REVIEW_SETUP_COMMAND: ${{ inputs.review-setup-command || vars.AI_REVIEW_SETUP_COMMAND }}
      AI_REVIEW_WORKING_DIRECTORY: ${{ inputs.review-working-directory || vars.AI_REVIEW_WORKING_DIRECTORY || '.' }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the trusted reviewer from the base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      # Installs dependencies without the provider key, so nothing an installer runs can read it.
      - name: Prepare engineering reviewer
        if: ${{ env.AI_REVIEW_SETUP_COMMAND != '' }}
        working-directory: trusted
        shell: bash
        run: bash -euo pipefail -c "${AI_REVIEW_SETUP_COMMAND}"
      - name: Run engineering reviewer
        id: review
        working-directory: trusted
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
        run: |
          set -euo pipefail
          export AI_REVIEW_RESULT="${RUNNER_TEMP}/ai-review/${AI_REVIEW_ROLE}.json"
          export AI_REVIEW_TARGET="${GITHUB_WORKSPACE}/candidate/${AI_REVIEW_WORKING_DIRECTORY}"
          export AI_REVIEW_BASE_SHA="${BASE_SHA}" AI_REVIEW_HEAD_SHA="${HEAD_SHA}"
          mkdir -p "${RUNNER_TEMP}/ai-review"
          status=0
          bash -euo pipefail -c "${AI_REVIEW_COMMAND}" || status=$?
          if [[ ! -s "${AI_REVIEW_RESULT}" ]]; then
            echo "::error::The reviewer wrote no result file (exit ${status})." >&2
            exit $(( status == 0 ? 1 : status ))
          fi
          jq -e 'type == "object" and (.findings | type == "array" and all(.[]; type == "object"))' "${AI_REVIEW_RESULT}" > /dev/null
          echo "written=true" >> "${GITHUB_OUTPUT}"
          exit "${status}"
      # Optional, self-reported finding counts for the Proof scorecard: never changes this check's result.
      - name: Package self-reported finding counts
        id: measurements
        if: ${{ always() && (steps.review.outcome == 'success' || steps.review.outcome == 'failure') }}
        shell: bash
        env:
          OUTCOME: ${{ steps.review.outcome }}
        run: |
          result="${RUNNER_TEMP}/ai-review/${AI_REVIEW_ROLE}.json"
          if [[ ! -f trusted/.proof/measurements.py || ! -s "${result}" ]]; then
            echo "No Proof runtime or reviewer result file; the scorecard will show finding counts as not collected."
            exit 0
          fi
          input="${RUNNER_TEMP}/proof-measurements-input.json"
          if python3 trusted/.proof/measurements.py review-findings "${result}" --output "${input}" \
              && python3 trusted/.proof/measurements.py package --control ai-engineering-review --input "${input}" \
                --outcome "${OUTCOME}" --head-sha "${HEAD_SHA}" --output "${RUNNER_TEMP}/proof-measurements/proof-measurements.json"; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::Finding counts were not packaged; the check result is unaffected."
          fi
      - name: Upload self-reported finding counts
        if: ${{ always() && steps.measurements.outputs.present == 'true' }}
        # Optional display metadata: an upload failure must not change the check result.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proof-measurements-ai-engineering-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof-measurements/proof-measurements.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload engineering findings
        if: ${{ always() && steps.review.outputs.written == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ai-review-engineering
          path: ${{ runner.temp }}/ai-review/engineering.json
          if-no-files-found: error
          retention-days: 14

