          if python3 trusted/.proof/measurements.py review-findings "${result}" --output "${input}" \
              && python3 trusted/.proof/measurements.py package --control ai-qa-review --input "${input}" \
                --outcome "${OUTCOME}" --head-sha "${HEAD_SHA}" --output "${RUNNER_TEMP}/proof-measurements/proof-measurements.json"; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::Finding counts were not packaged; the check result is unaffected."
          fi
      - name: Upload self-reported finding counts
        if: ${{ always() && steps.measurements.outputs.present == 'true' }}
        # Optional display metadata: an upload failure must not change the check result.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proof-measurements-ai-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof-measurements/proof-measurements.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload QA findings
        if: ${{ always() && steps.review.outputs.written == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
