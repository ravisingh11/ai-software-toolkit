        shell: bash
        env:
          OUTCOME: ${{ steps.review.outcome }}
        run: |
          result="${RUNNER_TEMP}/ai-review/${AI_REVIEW_ROLE}.json"
          if [[ ! -f trusted/.proof/measurements.py || ! -s "${result}" ]]; then
            echo "No Proof runtime or reviewer result file; the scorecard will show finding counts as not collected."
            exit 0
