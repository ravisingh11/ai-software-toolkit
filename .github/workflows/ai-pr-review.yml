        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      # Installs dependencies without the provider key, so nothing an installer runs can read it.
      - name: Prepare repository standards reviewer
        if: ${{ env.AI_REVIEW_SETUP_COMMAND != '' }}
        working-directory: trusted
        shell: bash
        run: bash -euo pipefail -c "${AI_REVIEW_SETUP_COMMAND}"
      - name: Run repository standards reviewer
        id: review
        working-directory: trusted
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
