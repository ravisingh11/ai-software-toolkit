  repo-standards:
    name: AI Repo Standards Review
    if: ${{ (inputs.review-command || vars.AI_REVIEW_COMMAND) != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AI_REVIEW_ROLE: repo-standards
      AI_REVIEW_COMMAND: ${{ inputs.review-command || vars.AI_REVIEW_COMMAND }}
      AI_REVIEW_SETUP_COMMAND: ${{ inputs.review-setup-command || vars.AI_REVIEW_SETUP_COMMAND }}
      AI_REVIEW_WORKING_DIRECTORY: ${{ inputs.review-working-directory || vars.AI_REVIEW_WORKING_DIRECTORY || '.' }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
