name: FOSSA

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: fossa-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fossa:
    name: FOSSA
    if: ${{ vars.FOSSA_COMMAND != '' }}
    runs-on: ubuntu-latest
    env:
      FOSSA_COMMAND: ${{ vars.FOSSA_COMMAND }}
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run FOSSA integration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FOSSA_API_KEY}" || { echo "Configure FOSSA_API_KEY." >&2; exit 1; }
          bash -euo pipefail -c "${FOSSA_COMMAND}"
