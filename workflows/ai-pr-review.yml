      - name: Run repository standards reviewer
        id: review
        if: ${{ env.WITHHELD == '' }}
        working-directory: trusted
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
        run: |
          set -euo pipefail
          export AI_REVIEW_RESULT="${RUNNER_TEMP}/ai-review/${AI_REVIEW_ROLE}.json"
          export AI_REVIEW_TARGET="${GITHUB_WORKSPACE}/candidate/${AI_REVIEW_WORKING_DIRECTORY}"
          export AI_REVIEW_BASE_SHA="${BASE_SHA}" AI_REVIEW_HEAD_SHA="${HEAD_SHA}"
          mkdir -p "${RUNNER_TEMP}/ai-review"
          status=0
          bash -euo pipefail -c "${AI_REVIEW_COMMAND}" || status=$?
          if [[ ! -s "${AI_REVIEW_RESULT}" ]] \
              || ! jq -e 'type == "object" and (.findings | type == "array" and all(.[]; type == "object"))' "${AI_REVIEW_RESULT}" > /dev/null; then
            echo "REVIEW_STATUS=blocked" >> "${GITHUB_ENV}"
            echo "REVIEW_SUMMARY=execution-error: the reviewer wrote no valid result file (exit ${status})." >> "${GITHUB_ENV}"
            exit $(( status == 0 ? 1 : status ))
          fi
          echo "written=true" >> "${GITHUB_OUTPUT}"
          summary="$(jq -r '[.findings[] | select((.severity == "P0" or .severity == "P1") and ((.status // "open") != "resolved"))] | length as $b
            | "\(.findings | length) findings; \($b) unresolved P0/P1"' "${AI_REVIEW_RESULT}")"
          echo "REVIEW_STATUS=$([[ ${status} -eq 0 ]] && echo passed || echo failed)" >> "${GITHUB_ENV}"
          echo "REVIEW_SUMMARY=${summary}" >> "${GITHUB_ENV}"
          # Self-reported counts for the scorecard; they never change the result.
          python3 -I "${GITHUB_WORKSPACE}/trusted/.proof/measurements.py" review-findings "${AI_REVIEW_RESULT}" \
            --output "${RUNNER_TEMP}/measurements.json" \
            || echo "::warning::Finding counts were not recorded; the result is unaffected."
      - name: Record the result
        id: evidence
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WITHHELD}" ]]; then
            source_args=(--withheld "${WITHHELD}")
          else
            source_args=(--status "${REVIEW_STATUS:-blocked}" --summary "${REVIEW_SUMMARY:-execution-error: the reviewer did not run.}")
          fi
          python3 -I trusted/.proof/provider_check.py evidence \
            --provider-id "${PROVIDER_ID}" --check-name "${CHECK_NAME}" "${source_args[@]}" \
            --control "${CONTROL_ID}" --measurements "${RUNNER_TEMP}/measurements.json" \
            --output "${RUNNER_TEMP}/proof-evidence/proof-evidence.json"
          python3 -I trusted/.proof/provider_check.py check \
            --evidence "${RUNNER_TEMP}/proof-evidence/proof-evidence.json" --output "${RUNNER_TEMP}/check-run.json"
          jq -r '"\(.check_name): \(.status) — \(.summary)"' "${RUNNER_TEMP}/proof-evidence/proof-evidence.json" >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload run-bound evidence
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proof-ai-repository-standards-adapter-${{ github.run_id }}
          path: ${{ runner.temp }}/proof-evidence/proof-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish the AI Repo Standards Review check
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" --input "${RUNNER_TEMP}/check-run.json" > /dev/null
          # The provider check carries the verdict; this job fails too, so it never reads as a pass.
          jq -e '.status == "passed"' "${RUNNER_TEMP}/proof-evidence/proof-evidence.json" > /dev/null
      - name: Upload repository standards findings
        if: ${{ always() && steps.review.outputs.written == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ai-review-repo-standards
          path: ${{ runner.temp }}/ai-review/repo-standards.json
          if-no-files-found: error
          retention-days: 14

  consolidate:
    name: AI PR Review Consolidation
    if: ${{ always() && vars.AI_REVIEW_COMMAND != '' }}
    needs: [engineering, qa, security, repo-standards]
    runs-on: ubuntu-latest
    steps:
      - name: Download reviewer results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ai-review-*
          path: ai-review
          merge-multiple: true
      # Report only: role checks already carry each reviewer's outcome, so this
      # summary never fails and never adds a second red check for AI judgment.
      - name: Summarize findings
        env:
          ENGINEERING_RESULT: ${{ needs.engineering.result }}
          QA_RESULT: ${{ needs.qa.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          REPO_STANDARDS_RESULT: ${{ needs.repo-standards.result }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          results=(ai-review/*.json)
          {
            echo "### AI PR Review (advisory-only)"
            echo
            echo "| Reviewer | Job result | P0 | P1 | P2 | P3 | Unresolved P0/P1 |"
            echo "| --- | --- | ---: | ---: | ---: | ---: | ---: |"
            for pair in "engineering:${ENGINEERING_RESULT}" "qa:${QA_RESULT}" "security:${SECURITY_RESULT}" "repo-standards:${REPO_STANDARDS_RESULT}"; do
              role="${pair%%:*}" job="${pair#*:}" file="ai-review/${pair%%:*}.json"
              if [[ -s "${file}" ]]; then
                jq -r --arg role "${role}" --arg job "${job}" '[.findings[]? | objects] as $f
                  | "| \($role) | \($job) | \([$f[] | select(.severity == "P0")] | length) | \([$f[] | select(.severity == "P1")] | length) | \([$f[] | select(.severity == "P2")] | length) | \([$f[] | select(.severity == "P3")] | length) | \([$f[] | select((.severity == "P0" or .severity == "P1") and ((.status // "open") != "resolved"))] | length) |"' "${file}"
              else
                echo "| ${role} | ${job} | — | — | — | — | no result |"
              fi
            done
            echo
            echo "Read each reviewer's findings in its job log or the ai-review-* artifacts. AI review is advisory-only."
          } >> "${GITHUB_STEP_SUMMARY}"
          if (( ${#results[@]} )); then
            jq -s 'map(.findings // [] | if type == "array" then map(objects) else [] end) | flatten' "${results[@]}" > ai-review/consolidated-findings.json
          fi
      - name: Upload consolidated findings
        if: ${{ always() && hashFiles('ai-review/consolidated-findings.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ai-review-consolidated
          path: ai-review/consolidated-findings.json
          if-no-files-found: error
          retention-days: 14
