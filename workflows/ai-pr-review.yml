name: AI PR Review

# Four advisory AI reviewers (engineering, QA, security, repository standards)
# and a report-only consolidation job. Each role job runs the repository-owned
# AI_REVIEW_COMMAND from the default branch (`trusted/`) against the
# pull-request head (`candidate/`), which it reads as data only: no
# pull-request code runs in these jobs, and the reviewer only reads the diff.
#
# ANTHROPIC_API_KEY never shares a job or a runner with pull-request code. The
# workflow runs on pull_request_target, so GitHub takes this file and the
# reviewer from the default branch, and a pull request cannot edit what
# receives the key. The key is a secret of the `proof-providers` environment,
# whose deployment branches must be limited to the default branch. The
# optional AI_REVIEW_SETUP_COMMAND installs the reviewer's dependencies from
# the default branch, in a step without the key. Fork pull requests are not
# reviewed unless the PROOF_PROVIDERS_SCAN_FORKS repository variable is
# "true": review sends the diff to the model provider and spends its quota.
#
# The command receives AI_REVIEW_ROLE, AI_REVIEW_RESULT, AI_REVIEW_TARGET,
# AI_REVIEW_BASE_SHA, AI_REVIEW_HEAD_SHA, and AI_REVIEW_MODEL, and exits
# non-zero when it cannot complete the review or when unresolved P0/P1
# findings remain. Each role job posts the check named in the provider
# contract ("AI Engineering Review", ...) for the pull-request head, with the
# external id proof:<provider>:<run id>:<head sha>, and uploads the same result
# as the run-bound artifact proof-<provider>-<run id>, with the finding counts
# the reviewer reported. Every job is skipped until AI_REVIEW_COMMAND is
# configured; a skipped check is never a pass. AI review is advisory-only and
# must not be a required status check.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: ai-pr-review-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  engineering:
    name: AI Engineering Reviewer
    if: ${{ vars.AI_REVIEW_COMMAND != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: proof-providers
      deployment: false
    permissions:
      contents: read
      checks: write
    env:
      AI_REVIEW_ROLE: engineering
      PROVIDER_ID: ai-engineering-adapter
      CHECK_NAME: AI Engineering Review
      CONTROL_ID: ai-engineering-review
      AI_REVIEW_COMMAND: ${{ vars.AI_REVIEW_COMMAND }}
      AI_REVIEW_SETUP_COMMAND: ${{ vars.AI_REVIEW_SETUP_COMMAND }}
      AI_REVIEW_WORKING_DIRECTORY: ${{ vars.AI_REVIEW_WORKING_DIRECTORY || '.' }}
      WITHHELD: ${{ github.event.pull_request.head.repo.full_name != github.repository && vars.PROOF_PROVIDERS_SCAN_FORKS != 'true' && 'fork pull requests are not sent to the model provider unless the PROOF_PROVIDERS_SCAN_FORKS repository variable is true.' || '' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BASE_REF: refs/heads/${{ github.event.pull_request.base.ref }}
    steps:
      - name: Check out the trusted runtime from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Require the trusted runtime
        shell: bash
        run: |
          set -euo pipefail
          for file in provider_check.py evaluate.py; do
            if [[ -L trusted/.proof || -L "trusted/.proof/${file}" || ! -f "trusted/.proof/${file}" ]]; then
              echo "::error::The default branch has no regular .proof/${file}; refresh the Proof runtime (tooling/install.py --refresh-existing) and merge it before this check can produce evidence." >&2
              exit 1
            fi
          done
      - name: Check out the pull request head as data
        if: ${{ env.WITHHELD == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      # Installs dependencies without the provider key, so nothing an installer runs can read it.
      - name: Prepare engineering reviewer
        if: ${{ env.WITHHELD == '' && env.AI_REVIEW_SETUP_COMMAND != '' }}
        working-directory: trusted
        shell: bash
        run: bash -euo pipefail -c "${AI_REVIEW_SETUP_COMMAND}"
      - name: Run engineering reviewer
        id: review
        if: ${{ env.WITHHELD == '' }}
        working-directory: trusted
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
        run: |
          set -euo pipefail
          export AI_REVIEW_RESULT="${RUNNER_TEMP}/ai-review/${AI_REVIEW_ROLE}.json"
          export AI_REVIEW_TARGET="${GITHUB_WORKSPACE}/candidate/${AI_REVIEW_WORKING_DIRECTORY}"
          export AI_REVIEW_BASE_SHA="${BASE_SHA}" AI_REVIEW_HEAD_SHA="${HEAD_SHA}"
          mkdir -p "${RUNNER_TEMP}/ai-review"
          status=0
          bash -euo pipefail -c "${AI_REVIEW_COMMAND}" || status=$?
          if [[ ! -s "${AI_REVIEW_RESULT}" ]] \
              || ! jq -e 'type == "object" and (.findings | type == "array" and all(.[]; type == "object"))' "${AI_REVIEW_RESULT}" > /dev/null; then
            echo "REVIEW_STATUS=blocked" >> "${GITHUB_ENV}"
            echo "REVIEW_SUMMARY=execution-error: the reviewer wrote no valid result file (exit ${status})." >> "${GITHUB_ENV}"
            exit $(( status == 0 ? 1 : status ))
          fi
          echo "written=true" >> "${GITHUB_OUTPUT}"
          summary="$(jq -r '[.findings[] | select((.severity == "P0" or .severity == "P1") and ((.status // "open") != "resolved"))] | length as $b
            | "\(.findings | length) findings; \($b) unresolved P0/P1"' "${AI_REVIEW_RESULT}")"
          echo "REVIEW_STATUS=$([[ ${status} -eq 0 ]] && echo passed || echo failed)" >> "${GITHUB_ENV}"
          echo "REVIEW_SUMMARY=${summary}" >> "${GITHUB_ENV}"
          # Self-reported counts for the scorecard; they never change the result.
          python3 -I "${GITHUB_WORKSPACE}/trusted/.proof/measurements.py" review-findings "${AI_REVIEW_RESULT}" \
            --output "${RUNNER_TEMP}/measurements.json" \
            || echo "::warning::Finding counts were not recorded; the result is unaffected."
      - name: Record the result
        id: evidence
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WITHHELD}" ]]; then
            source_args=(--withheld "${WITHHELD}")
          else
            source_args=(--status "${REVIEW_STATUS:-blocked}" --summary "${REVIEW_SUMMARY:-execution-error: the reviewer did not run.}")
          fi
          python3 -I trusted/.proof/provider_check.py evidence \
            --provider-id "${PROVIDER_ID}" --check-name "${CHECK_NAME}" "${source_args[@]}" \
            --control "${CONTROL_ID}" --measurements "${RUNNER_TEMP}/measurements.json" \
            --output "${RUNNER_TEMP}/proof-evidence/proof-evidence.json"
          python3 -I trusted/.proof/provider_check.py check \
            --evidence "${RUNNER_TEMP}/proof-evidence/proof-evidence.json" --output "${RUNNER_TEMP}/check-run.json"
          jq -r '"\(.check_name): \(.status) — \(.summary)"' "${RUNNER_TEMP}/proof-evidence/proof-evidence.json" >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload run-bound evidence
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proof-ai-engineering-adapter-${{ github.run_id }}
          path: ${{ runner.temp }}/proof-evidence/proof-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish the AI Engineering Review check
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" --input "${RUNNER_TEMP}/check-run.json" > /dev/null
          # The provider check carries the verdict; this job fails too, so it never reads as a pass.
          jq -e '.status == "passed"' "${RUNNER_TEMP}/proof-evidence/proof-evidence.json" > /dev/null
      - name: Upload engineering findings
        if: ${{ always() && steps.review.outputs.written == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ai-review-engineering
          path: ${{ runner.temp }}/ai-review/engineering.json
          if-no-files-found: error
          retention-days: 14

