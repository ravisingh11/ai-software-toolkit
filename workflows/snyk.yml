name: Snyk

# Adapter-owned Snyk workflow. The installed .proof/adapter.py decides the
# command shape (`snyk code test` and `snyk test`) and maps exit codes to
# evidence: 0 passed, 1 failed (findings), 2 blocked (error or authentication),
# 3 not_run (no supported projects). Consumers supply arguments through the
# SNYK_CODE_ARGS and SNYK_OPEN_SOURCE_ARGS repository variables, never the verb.
# Any non-passing outcome fails the job; the reason code is in the job summary
# and in the uploaded evidence fragment. Set the SNYK_CODE_ENABLED or
# SNYK_OPEN_SOURCE_ENABLED repository variable to "false" to skip a job whose
# provider is not selected. The token reaches only the adapter step, never the
# repository setup command. This workflow is used directly (not through
# workflow_call) so its check names match the provider contract exactly.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: snyk-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  snyk-code:
    name: Snyk Code
    if: ${{ vars.SNYK_CODE_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SNYK_CODE_ARGS: ${{ vars.SNYK_CODE_ARGS }}
      PROOF_WORKING_DIRECTORY: ${{ vars.PROOF_WORKING_DIRECTORY || '.' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require the installed adapter
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .proof/adapter.py ]]; then
            echo "::error::.proof/adapter.py is missing; refresh the Proof installation (tooling/install.py --refresh-existing)." >&2
            exit 1
          fi
      - name: Install Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04
      - name: Run Snyk Code through the adapter
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -uo pipefail
          python3 .proof/adapter.py snyk-code \
            --target "${PROOF_WORKING_DIRECTORY}" \
            --revision "${HEAD_SHA}" \
            --timeout 1200 \
            --evidence-dir "${RUNNER_TEMP}/evidence" | tee "${RUNNER_TEMP}/snyk-code.txt"
          status=${PIPESTATUS[0]}
          printf '### Snyk Code\n\n```text\n%s\n```\n' "$(cat "${RUNNER_TEMP}/snyk-code.txt")" >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"
      - name: Upload evidence fragment
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proof-snyk-code-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/snyk-code.json
          if-no-files-found: ignore
          retention-days: 7

  snyk-open-source:
    name: Snyk Open Source
    if: ${{ vars.SNYK_OPEN_SOURCE_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SNYK_OPEN_SOURCE_ARGS: ${{ vars.SNYK_OPEN_SOURCE_ARGS }}
      PROOF_SETUP_COMMAND: ${{ vars.PROOF_SETUP_COMMAND }}
      PROOF_WORKING_DIRECTORY: ${{ vars.PROOF_WORKING_DIRECTORY || '.' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require the installed adapter
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .proof/adapter.py ]]; then
            echo "::error::.proof/adapter.py is missing; refresh the Proof installation (tooling/install.py --refresh-existing)." >&2
            exit 1
          fi
      - name: Install dependencies with the repository setup command
        if: ${{ vars.PROOF_SETUP_COMMAND != '' }}
        working-directory: ${{ vars.PROOF_WORKING_DIRECTORY || '.' }}
        shell: bash
        run: bash -euo pipefail -c "${PROOF_SETUP_COMMAND}"
      - name: Install Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04
      - name: Run Snyk Open Source through the adapter
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -uo pipefail
          python3 .proof/adapter.py snyk-open-source \
            --target "${PROOF_WORKING_DIRECTORY}" \
            --revision "${HEAD_SHA}" \
            --timeout 1200 \
            --evidence-dir "${RUNNER_TEMP}/evidence" | tee "${RUNNER_TEMP}/snyk-open-source.txt"
          status=${PIPESTATUS[0]}
          printf '### Snyk Open Source\n\n```text\n%s\n```\n' "$(cat "${RUNNER_TEMP}/snyk-open-source.txt")" >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"
      - name: Upload evidence fragment
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proof-snyk-open-source-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/snyk-open-source.json
          if-no-files-found: ignore
          retention-days: 7
