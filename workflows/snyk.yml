            --measurements "${RUNNER_TEMP}/measurements.json" | /usr/bin/tee "${RUNNER_TEMP}/scan.txt"
          printf '### Snyk Open Source\n\n```text\n%s\n```\n' "$(/bin/cat "${RUNNER_TEMP}/scan.txt")" >> "${GITHUB_STEP_SUMMARY}"
      - name: Record the result
        id: evidence
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WITHHELD}" ]]; then
            source_args=(--withheld "${WITHHELD}")
          else
            source_args=(--fragment "${RUNNER_TEMP}/evidence/${PROVIDER_ID}.json")
          fi
          python3 -I trusted/.proof/provider_check.py evidence \
            --provider-id "${PROVIDER_ID}" --check-name "${CHECK_NAME}" "${source_args[@]}" \
            --control "${CONTROL_ID}" --measurements "${RUNNER_TEMP}/measurements.json" \
            --output "${RUNNER_TEMP}/proof-evidence/proof-evidence.json"
          python3 -I trusted/.proof/provider_check.py check \
