name: Snyk

# Adapter-owned Snyk workflow. The installed .guardrails/adapter.py decides the
# command shape (`snyk code test` and `snyk test`) and maps exit codes to
# evidence: 0 passed, 1 failed (findings), 2 blocked (error or authentication),
# 3 not_run (no supported projects). Consumers supply arguments through the
# SNYK_CODE_ARGS and SNYK_OPEN_SOURCE_ARGS repository variables, never the verb.
# Any non-passing outcome fails the job; the reason code is in the job summary
# and in the uploaded evidence fragment.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      snyk-code-args:
        description: Extra arguments for `snyk code test`.
        required: false
        type: string
        default: ''
      snyk-open-source-args:
        description: Extra arguments for `snyk test`.
        required: false
        type: string
        default: ''
    secrets:
      SNYK_TOKEN:
        description: Snyk API token.
        required: true

permissions:
  contents: read

jobs:
  snyk-code:
    name: Snyk Code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SNYK_CODE_ARGS: ${{ inputs.snyk-code-args || vars.SNYK_CODE_ARGS }}
      GUARDRAILS_WORKING_DIRECTORY: ${{ vars.GUARDRAILS_WORKING_DIRECTORY || '.' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require the installed adapter
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .guardrails/adapter.py ]]; then
            echo "::error::.guardrails/adapter.py is missing; refresh the Guardrails installation (tooling/install.py --refresh-existing)." >&2
            exit 1
          fi
      - name: Install Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04
      - name: Run Snyk Code through the adapter
        shell: bash
        run: |
          set -uo pipefail
          python3 .guardrails/adapter.py snyk-code \
            --target "${GUARDRAILS_WORKING_DIRECTORY}" \
            --revision "${HEAD_SHA}" \
            --evidence-dir "${RUNNER_TEMP}/evidence" | tee "${RUNNER_TEMP}/snyk-code.txt"
          status=${PIPESTATUS[0]}
          printf '### Snyk Code\n\n```text\n%s\n```\n' "$(cat "${RUNNER_TEMP}/snyk-code.txt")" >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"
      - name: Upload evidence fragment
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: guardrails-snyk-code-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/snyk-code.json
          if-no-files-found: ignore
          retention-days: 7

  snyk-open-source:
    name: Snyk Open Source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SNYK_OPEN_SOURCE_ARGS: ${{ inputs.snyk-open-source-args || vars.SNYK_OPEN_SOURCE_ARGS }}
      GUARDRAILS_SETUP_COMMAND: ${{ vars.GUARDRAILS_SETUP_COMMAND }}
      GUARDRAILS_WORKING_DIRECTORY: ${{ vars.GUARDRAILS_WORKING_DIRECTORY || '.' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require the installed adapter
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .guardrails/adapter.py ]]; then
            echo "::error::.guardrails/adapter.py is missing; refresh the Guardrails installation (tooling/install.py --refresh-existing)." >&2
            exit 1
          fi
      - name: Install dependencies with the repository setup command
        if: ${{ vars.GUARDRAILS_SETUP_COMMAND != '' }}
        working-directory: ${{ vars.GUARDRAILS_WORKING_DIRECTORY || '.' }}
        shell: bash
        run: bash -euo pipefail -c "${GUARDRAILS_SETUP_COMMAND}"
      - name: Install Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04
      - name: Run Snyk Open Source through the adapter
        shell: bash
        run: |
          set -uo pipefail
          python3 .guardrails/adapter.py snyk-open-source \
            --target "${GUARDRAILS_WORKING_DIRECTORY}" \
            --revision "${HEAD_SHA}" \
            --evidence-dir "${RUNNER_TEMP}/evidence" | tee "${RUNNER_TEMP}/snyk-open-source.txt"
          status=${PIPESTATUS[0]}
          printf '### Snyk Open Source\n\n```text\n%s\n```\n' "$(cat "${RUNNER_TEMP}/snyk-open-source.txt")" >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"
      - name: Upload evidence fragment
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: guardrails-snyk-open-source-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/snyk-open-source.json
          if-no-files-found: ignore
          retention-days: 7
