# Guardrails v2 installer-owned workflow.
name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require configured command
        run: |
          if [[ -z "${GUARDRAILS_BUILD_COMMAND}" ]]; then
            echo "::error::GUARDRAILS_BUILD_COMMAND is not configured"
            exit 1
          fi
        env:
          GUARDRAILS_BUILD_COMMAND: ${{ vars.GUARDRAILS_BUILD_COMMAND }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup repository
        if: ${{ vars.GUARDRAILS_SETUP_COMMAND != '' }}
        working-directory: ${{ vars.GUARDRAILS_WORKING_DIRECTORY || '.' }}
        run: bash -euo pipefail -c "${GUARDRAILS_SETUP_COMMAND}"
        env:
          GUARDRAILS_SETUP_COMMAND: ${{ vars.GUARDRAILS_SETUP_COMMAND }}
      - name: Build
        working-directory: ${{ vars.GUARDRAILS_WORKING_DIRECTORY || '.' }}
        run: bash -euo pipefail -c "${GUARDRAILS_BUILD_COMMAND}"
        env:
          GUARDRAILS_BUILD_COMMAND: ${{ vars.GUARDRAILS_BUILD_COMMAND }}
          GUARDRAILS_WORKING_DIRECTORY: ${{ vars.GUARDRAILS_WORKING_DIRECTORY }}
