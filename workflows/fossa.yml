name: FOSSA

# Adapter-owned FOSSA workflow. The installed .proof/adapter.py runs
# `fossa analyze` and then `fossa test` for the exact revision; an upload alone
# never passes. Exit codes and output map to evidence with a reason code
# (credential-missing, authentication-failed, analysis-incomplete,
# execution-error, unsupported-project, timed-out). Consumers supply extra
# `fossa analyze` arguments through the FOSSA_ARGS repository variable, and an
# alternative server through FOSSA_ENDPOINT. The CLI is pinned by version and
# SHA-256; update both together. Set the FOSSA_ENABLED repository variable to
# "false" to skip the job when FOSSA is not selected.
#
# FOSSA_API_KEY never shares a job or a runner with pull-request code. The
# workflow runs on pull_request_target, so GitHub takes this file and the
# .proof runtime from the default branch, and a pull request cannot edit what
# receives the key. The key is a secret of the `proof-providers` environment,
# whose deployment branches must be limited to the default branch. The job
# reads the pull-request head as data only (`--data-only`): FOSSA runs with
# `--static-only-analysis`, so it invokes no build tool, and with a fixed
# endpoint; a candidate .fossa.yml that names a server, endpoint, or API key is
# refused. Fork pull requests are not scanned: this path has not been
# independently verified for outside contributors.
#
# The job posts the "FOSSA" check for the pull-request head, with the external
# id proof:fossa:<run id>:<head sha>, and uploads the same result as the
# run-bound artifact proof-fossa-<run id>, which the Proof collector reads. The
# job's own check has a different name, and any non-passing result also fails
# the job.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: fossa-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  FOSSA_CLI_VERSION: 3.19.3
  FOSSA_CLI_SHA256: f2e946ff25717241e92765093409e73e879d21791a56e2d6520d17f311698fe8

jobs:
  fossa:
    name: FOSSA scan
    if: ${{ vars.FOSSA_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: proof-providers
      deployment: false
    permissions:
      contents: read
      checks: write
    env:
      PROVIDER_ID: fossa
      CHECK_NAME: FOSSA
      CONTROL_ID: license-compliance
      FOSSA_ARGS: ${{ vars.FOSSA_ARGS }}
      FOSSA_ENDPOINT: ${{ vars.FOSSA_ENDPOINT }}
      PROOF_WORKING_DIRECTORY: ${{ vars.PROOF_WORKING_DIRECTORY || '.' }}
      WITHHELD: ${{ github.event.pull_request.head.repo.full_name != github.repository && 'fork pull requests are not sent to FOSSA because fork scanning has not been independently verified.' || '' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BASE_REF: refs/heads/${{ github.event.pull_request.base.ref }}
    steps:
      - name: Check out the trusted runtime from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .proof/adapter.py
            .proof/provider_check.py
            .proof/evaluate.py
          sparse-checkout-cone-mode: false
      - name: Require the trusted runtime
        shell: bash
        run: |
          set -euo pipefail
          for file in adapter.py provider_check.py; do
            if [[ -L trusted/.proof || -L "trusted/.proof/${file}" || ! -f "trusted/.proof/${file}" ]]; then
              echo "::error::The default branch has no regular .proof/${file}; refresh the Proof runtime (tooling/install.py --refresh-existing) and merge it before this check can produce evidence." >&2
              exit 1
            fi
          done
      - name: Check out the pull request head as data
        if: ${{ env.WITHHELD == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Install the pinned FOSSA CLI
        if: ${{ env.WITHHELD == '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/fossa-cli"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/fossa-cli/fossa.zip" \
            "https://github.com/fossas/fossa-cli/releases/download/v${FOSSA_CLI_VERSION}/fossa_${FOSSA_CLI_VERSION}_linux_amd64.zip"
          echo "${FOSSA_CLI_SHA256}  ${RUNNER_TEMP}/fossa-cli/fossa.zip" | sha256sum --check --strict
          unzip -q -o "${RUNNER_TEMP}/fossa-cli/fossa.zip" fossa -d "${RUNNER_TEMP}/fossa-cli"
          chmod +x "${RUNNER_TEMP}/fossa-cli/fossa"
          echo "${RUNNER_TEMP}/fossa-cli" >> "${GITHUB_PATH}"
      - name: Run FOSSA through the trusted adapter
        if: ${{ env.WITHHELD == '' }}
        shell: bash
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        run: |
          set -uo pipefail
          # A minimal environment: the adapter and the CLI receive the credential and nothing else of the job.
          /usr/bin/env -i \
            PATH="${PATH}" HOME="${HOME}" CI=true \
            FOSSA_API_KEY="${FOSSA_API_KEY}" FOSSA_ARGS="${FOSSA_ARGS}" FOSSA_ENDPOINT="${FOSSA_ENDPOINT}" \
            python3 -I trusted/.proof/adapter.py fossa --data-only \
            --target "candidate/${PROOF_WORKING_DIRECTORY}" \
            --revision "${HEAD_SHA}" \
            --timeout 1200 \
            --evidence-dir "${RUNNER_TEMP}/evidence" \
            --measurements "${RUNNER_TEMP}/measurements.json" | /usr/bin/tee "${RUNNER_TEMP}/scan.txt"
          printf '### FOSSA\n\n```text\n%s\n```\n' "$(/bin/cat "${RUNNER_TEMP}/scan.txt")" >> "${GITHUB_STEP_SUMMARY}"
      - name: Record the result
        id: evidence
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WITHHELD}" ]]; then
            source_args=(--withheld "${WITHHELD}")
          else
            source_args=(--fragment "${RUNNER_TEMP}/evidence/${PROVIDER_ID}.json")
          fi
          python3 -I trusted/.proof/provider_check.py evidence \
            --provider-id "${PROVIDER_ID}" --check-name "${CHECK_NAME}" "${source_args[@]}" \
            --control "${CONTROL_ID}" --measurements "${RUNNER_TEMP}/measurements.json" \
            --output "${RUNNER_TEMP}/proof-evidence/proof-evidence.json"
          python3 -I trusted/.proof/provider_check.py check \
            --evidence "${RUNNER_TEMP}/proof-evidence/proof-evidence.json" --output "${RUNNER_TEMP}/check-run.json"
          jq -r '"\(.check_name): \(.status) — \(.summary)"' "${RUNNER_TEMP}/proof-evidence/proof-evidence.json" >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload run-bound evidence
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proof-fossa-${{ github.run_id }}
          path: ${{ runner.temp }}/proof-evidence/proof-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish the FOSSA check
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" --input "${RUNNER_TEMP}/check-run.json" > /dev/null
          # The provider check carries the verdict; this job fails too, so it never reads as a pass.
          jq -e '.status == "passed"' "${RUNNER_TEMP}/proof-evidence/proof-evidence.json" > /dev/null
