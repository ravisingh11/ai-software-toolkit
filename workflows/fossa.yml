name: FOSSA

# Adapter-owned FOSSA workflow. The installed .proof/adapter.py runs
# `fossa analyze` and then `fossa test` for the exact revision; an upload alone
# never passes. Exit codes and output map to evidence with a reason code
# (credential-missing, authentication-failed, analysis-incomplete,
# execution-error, unsupported-project, timed-out). Consumers supply extra
# `fossa analyze` arguments through the FOSSA_ARGS repository variable. The
# CLI is pinned by version and SHA-256; update both together. The key reaches
# only the adapter step. This workflow is used directly (not through
# workflow_call) so its check name matches the provider contract exactly.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: fossa-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FOSSA_CLI_VERSION: 3.19.3
  FOSSA_CLI_SHA256: f2e946ff25717241e92765093409e73e879d21791a56e2d6520d17f311698fe8

jobs:
  fossa:
    name: FOSSA
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FOSSA_ARGS: ${{ vars.FOSSA_ARGS }}
      PROOF_WORKING_DIRECTORY: ${{ vars.PROOF_WORKING_DIRECTORY || '.' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require the installed adapter
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .proof/adapter.py ]]; then
            echo "::error::.proof/adapter.py is missing; refresh the Proof installation (tooling/install.py --refresh-existing)." >&2
            exit 1
          fi
      - name: Install the pinned FOSSA CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/fossa-cli"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/fossa-cli/fossa.zip" \
            "https://github.com/fossas/fossa-cli/releases/download/v${FOSSA_CLI_VERSION}/fossa_${FOSSA_CLI_VERSION}_linux_amd64.zip"
          echo "${FOSSA_CLI_SHA256}  ${RUNNER_TEMP}/fossa-cli/fossa.zip" | sha256sum --check --strict
          unzip -q -o "${RUNNER_TEMP}/fossa-cli/fossa.zip" fossa -d "${RUNNER_TEMP}/fossa-cli"
          chmod +x "${RUNNER_TEMP}/fossa-cli/fossa"
          echo "${RUNNER_TEMP}/fossa-cli" >> "${GITHUB_PATH}"
      - name: Run FOSSA analyze and test through the adapter
        shell: bash
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        run: |
          set -uo pipefail
          python3 .proof/adapter.py fossa \
            --target "${PROOF_WORKING_DIRECTORY}" \
            --revision "${HEAD_SHA}" \
            --timeout 1200 \
            --evidence-dir "${RUNNER_TEMP}/evidence" | tee "${RUNNER_TEMP}/fossa.txt"
          status=${PIPESTATUS[0]}
          printf '### FOSSA\n\n```text\n%s\n```\n' "$(cat "${RUNNER_TEMP}/fossa.txt")" >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"
      - name: Upload evidence fragment
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proof-fossa-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/fossa.json
          if-no-files-found: ignore
          retention-days: 7
