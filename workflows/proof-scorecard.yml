# Proof installer-owned workflow.
name: Proof Scorecard

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:

concurrency:
  group: proof-scorecard-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  checks: read
  pull-requests: read

jobs:
  scorecard:
    name: Proof Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out trusted Proof runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .proof-trusted
          persist-credentials: false
      - name: Check out candidate Proof configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: .proof-candidate
          persist-credentials: false
          sparse-checkout: |
            .proof/policy.yaml
          sparse-checkout-cone-mode: false
      - name: Validate candidate configuration paths
        run: |
          set -euo pipefail
          candidate_root="${PWD}/.proof-candidate"
          for relative in \
            .proof/policy.yaml
          do
            current="${candidate_root}"
            IFS='/' read -r -a components <<< "${relative}"
            for component in "${components[@]}"; do
              current="${current}/${component}"
              if [ -L "${current}" ]; then
                echo "candidate Proof input must be a regular non-symlink file: ${relative}" >&2
                exit 1
              fi
            done
            if [ ! -f "${current}" ]; then
              echo "candidate Proof input must be a regular non-symlink file: ${relative}" >&2
              exit 1
            fi
          done
          python3 .proof-trusted/.proof/configure.py \
            --policy .proof-candidate/.proof/policy.yaml \
            --profiles .proof-trusted/.proof/profiles.yaml \
            --catalog .proof-trusted/.proof/control-catalog.yaml \
            --providers .proof-trusted/.proof/providers.yaml \
            --list \
            > /dev/null
      - name: Write trusted source binding
        if: ${{ github.event.pull_request != null }}
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/proof
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          pull_request = event.get("pull_request")
          if not isinstance(pull_request, dict):
              raise SystemExit("trusted source binding requires a pull-request event payload")
          head = pull_request.get("head")
          base = pull_request.get("base")
          if not isinstance(head, dict) or not isinstance(base, dict):
              raise SystemExit("pull-request head and base records are required")
          base_repository = base.get("repo")
          if not isinstance(base_repository, dict):
              raise SystemExit("pull-request base repository is required")
          head_sha = head.get("sha")
          base_sha = base.get("sha")
          if not isinstance(head_sha, str) or re.fullmatch(r"[0-9a-f]{40}", head_sha) is None:
              raise SystemExit("pull-request head SHA is invalid")
          if not isinstance(base_sha, str) or re.fullmatch(r"[0-9a-f]{40}", base_sha) is None:
              raise SystemExit("pull-request base SHA is invalid")
          source = {
              "version": 1,
              "run_id": int(os.environ["SOURCE_RUN_ID"]),
              "run_attempt": int(os.environ["SOURCE_RUN_ATTEMPT"]),
              "event": os.environ["GITHUB_EVENT_NAME"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "pull_request_number": pull_request.get("number"),
              "head_sha": head_sha,
              "base_repository": base_repository.get("full_name"),
              "base_branch": base.get("ref"),
              "base_sha": base_sha,
          }
          if type(source["pull_request_number"]) is not int or source["pull_request_number"] <= 0:
              raise SystemExit("pull-request number is invalid")
          Path(".artifacts/proof/source.json").write_text(
              json.dumps(source, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Collect selected provider checks
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          TRUSTED_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.sha }}
          TRUSTED_WORKFLOW_REF: ${{ github.event.pull_request.base.ref && format('refs/heads/{0}', github.event.pull_request.base.ref) || github.ref }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/proof
          PROOF_TIMESTAMP="$(date -u +%Y%m%d-%H%M%SZ)"
          echo "PROOF_TIMESTAMP=${PROOF_TIMESTAMP}" >> "${GITHUB_ENV}"
          EVIDENCE_JSON=".artifacts/proof/evidence-${PROOF_TIMESTAMP}.json"
          review_args=()
          if [ -n "${PULL_REQUEST_NUMBER}" ] && \
            python3 .proof-trusted/.proof/github_evidence.py --help 2>&1 | \
              grep -q -- "--pull-request-number"
          then
            review_args+=(--pull-request-number "${PULL_REQUEST_NUMBER}")
          fi
          python3 .proof-trusted/.proof/github_evidence.py \
            --revision "${REVISION}" \
            --policy .proof-trusted/.proof/policy.yaml \
            --profiles .proof-trusted/.proof/profiles.yaml \
            --catalog .proof-trusted/.proof/control-catalog.yaml \
            --providers .proof-trusted/.proof/providers.yaml \
            --trusted-base-revision "${TRUSTED_BASE_REVISION}" \
            --trusted-workflow-ref "${TRUSTED_WORKFLOW_REF}" \
            "${review_args[@]}" \
            --output "${EVIDENCE_JSON}" \
            --wait-seconds 1800
          cp "${EVIDENCE_JSON}" .artifacts/proof/evidence.json
      - name: Render scorecard
        env:
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          EVIDENCE_JSON=".artifacts/proof/evidence-${PROOF_TIMESTAMP}.json"
          SCORECARD_JSON=".artifacts/proof/scorecard-${PROOF_TIMESTAMP}.json"
          SCORECARD_MARKDOWN=".artifacts/proof/scorecard-${PROOF_TIMESTAMP}.md"
          json_status=0
          python3 .proof-trusted/.proof/scorecard.py \
            --policy .proof-trusted/.proof/policy.yaml \
            --profiles .proof-trusted/.proof/profiles.yaml \
            --catalog .proof-trusted/.proof/control-catalog.yaml \
            --providers .proof-trusted/.proof/providers.yaml \
            --evidence "${EVIDENCE_JSON}" \
            --operation change \
            --revision "${REVISION}" \
            --subject-type git-commit \
            --all-catalog-controls \
            --json \
            > "${SCORECARD_JSON}" || json_status=$?
          markdown_status=0
          python3 .proof-trusted/.proof/scorecard.py \
            --policy .proof-trusted/.proof/policy.yaml \
            --profiles .proof-trusted/.proof/profiles.yaml \
            --catalog .proof-trusted/.proof/control-catalog.yaml \
            --providers .proof-trusted/.proof/providers.yaml \
            --evidence "${EVIDENCE_JSON}" \
            --operation change \
            --revision "${REVISION}" \
            --subject-type git-commit \
            --all-catalog-controls \
            > "${SCORECARD_MARKDOWN}" || markdown_status=$?
          cat "${SCORECARD_MARKDOWN}" >> "${GITHUB_STEP_SUMMARY}"
          if [ "${json_status}" -ne 0 ]; then
            exit "${json_status}"
          fi
          exit "${markdown_status}"
      - name: Upload scorecard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proof-scorecard-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/proof/source.json
            .artifacts/proof/scorecard-*.json
            .artifacts/proof/scorecard-*.md
          if-no-files-found: error
