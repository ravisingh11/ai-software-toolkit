# Proof installer-owned workflow.
name: Proof Scorecard

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:

concurrency:
  group: proof-scorecard-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  checks: read
  pull-requests: read
  security-events: read
  attestations: read

jobs:
  scorecard:
    name: Proof Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out trusted Proof runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request_review' && github.event.pull_request.base.sha || github.workflow_sha }}
          path: .proof-trusted
          persist-credentials: false
      - name: Record trusted runtime revision
        run: |
          runtime_sha="$(git -C .proof-trusted rev-parse HEAD)"
          printf 'Trusted runtime and policy revision: `%s`\n' "${runtime_sha}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Fetch candidate metadata without checkout
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          python3 .proof-trusted/.proof/fetch_pr_metadata.py \
            --repository-root .proof-candidate-git \
            --policy-output .proof-candidate/.proof/policy.yaml
      - name: Validate candidate configuration paths
        run: |
          set -euo pipefail
          candidate_root="${PWD}/.proof-candidate"
          for relative in \
            .proof/policy.yaml
          do
            current="${candidate_root}"
            IFS='/' read -r -a components <<< "${relative}"
            for component in "${components[@]}"; do
              current="${current}/${component}"
              if [ -L "${current}" ]; then
                echo "candidate Proof input must be a regular non-symlink file: ${relative}" >&2
                exit 1
              fi
            done
            if [ ! -f "${current}" ]; then
              echo "candidate Proof input must be a regular non-symlink file: ${relative}" >&2
              exit 1
            fi
          done
          python3 .proof-trusted/.proof/configure.py \
            --policy .proof-candidate/.proof/policy.yaml \
            --profiles .proof-trusted/.proof/profiles.yaml \
            --catalog .proof-trusted/.proof/control-catalog.yaml \
            --providers .proof-trusted/.proof/providers.yaml \
            --list \
            > /dev/null
      - name: Write trusted source binding
        if: ${{ github.event.pull_request != null }}
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/proof
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          pull_request = event.get("pull_request")
          if not isinstance(pull_request, dict):
              raise SystemExit("trusted source binding requires a pull-request event payload")
          head = pull_request.get("head")
          base = pull_request.get("base")
          if not isinstance(head, dict) or not isinstance(base, dict):
              raise SystemExit("pull-request head and base records are required")
          base_repository = base.get("repo")
          if not isinstance(base_repository, dict):
              raise SystemExit("pull-request base repository is required")
          head_sha = head.get("sha")
          base_sha = base.get("sha")
          if not isinstance(head_sha, str) or re.fullmatch(r"[0-9a-f]{40}", head_sha) is None:
              raise SystemExit("pull-request head SHA is invalid")
          if not isinstance(base_sha, str) or re.fullmatch(r"[0-9a-f]{40}", base_sha) is None:
              raise SystemExit("pull-request base SHA is invalid")
          source = {
              "version": 2,
              "runtime_sha": subprocess.check_output(["git", "-C", ".proof-trusted", "rev-parse", "HEAD"], text=True).strip(),
              "run_id": int(os.environ["SOURCE_RUN_ID"]),
              "run_attempt": int(os.environ["SOURCE_RUN_ATTEMPT"]),
              "event": os.environ["GITHUB_EVENT_NAME"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "pull_request_number": pull_request.get("number"),
              "head_sha": head_sha,
              "base_repository": base_repository.get("full_name"),
              "base_branch": base.get("ref"),
              "base_sha": base_sha,
          }
          if type(source["pull_request_number"]) is not int or source["pull_request_number"] <= 0:
              raise SystemExit("pull-request number is invalid")
          Path(".artifacts/proof/source.json").write_text(
              json.dumps(source, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Collect selected provider checks
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_CODEQL_CONFIGURATION_TOKEN: ${{ secrets.PROOF_CODEQL_CONFIGURATION_TOKEN }}
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          TRUSTED_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.sha }}
          TRUSTED_WORKFLOW_REF: ${{ github.event.pull_request.base.ref && format('refs/heads/{0}', github.event.pull_request.base.ref) || github.ref }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || '' }}
          SNYK_CODE_ENABLED: ${{ vars.SNYK_CODE_ENABLED }}
          SNYK_OPEN_SOURCE_ENABLED: ${{ vars.SNYK_OPEN_SOURCE_ENABLED }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          FOSSA_ENABLED: ${{ vars.FOSSA_ENABLED }}
          AI_REVIEW_COMMAND: ${{ vars.AI_REVIEW_COMMAND }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/proof
          PROOF_TIMESTAMP="$(date -u +%Y%m%d-%H%M%SZ)"
          echo "PROOF_TIMESTAMP=${PROOF_TIMESTAMP}" >> "${GITHUB_ENV}"
          EVIDENCE_JSON=".artifacts/proof/evidence-${PROOF_TIMESTAMP}.json"
          # Disabled optional jobs will not publish checks. Keep their missing
          # evidence, but do not spend the collection budget waiting for absence.
          # Manual QA and native reviews are sampled now; later PR review events
          # refresh the scorecard without reserving a runner for absent reviews.
          collector_args=(--wait-seconds 1800
            --no-wait-provider qa-bootstrap-workflow
            --no-wait-provider codex-github-review)
          if [ -z "${SONAR_HOST_URL:-}" ]; then
            collector_args+=(--no-wait-provider sonarqube)
          fi
          case "${FOSSA_ENABLED:-}" in
            [Ff][Aa][Ll][Ss][Ee]) collector_args+=(--no-wait-provider fossa) ;;
          esac
          if [ -z "${AI_REVIEW_COMMAND:-}" ]; then
            collector_args+=(--no-wait-provider ai-engineering-adapter
              --no-wait-provider ai-qa-adapter --no-wait-provider ai-security-adapter
              --no-wait-provider ai-repository-standards-adapter)
          fi
          # Match the Snyk jobs' case-insensitive GitHub string comparison.
          case "${SNYK_CODE_ENABLED:-}" in
            [Ff][Aa][Ll][Ss][Ee]) collector_args+=(--no-wait-provider snyk-code) ;;
          esac
          case "${SNYK_OPEN_SOURCE_ENABLED:-}" in
            [Ff][Aa][Ll][Ss][Ee]) collector_args+=(--no-wait-provider snyk-open-source) ;;
          esac
          if [ -n "${PULL_REQUEST_NUMBER}" ] && \
            python3 .proof-trusted/.proof/github_evidence.py --help 2>&1 | \
              grep -q -- "--pull-request-number"
          then
            collector_args+=(--pull-request-number "${PULL_REQUEST_NUMBER}")
          fi
          python3 .proof-trusted/.proof/github_evidence.py \
            --revision "${REVISION}" \
            --policy .proof-trusted/.proof/policy.yaml \
            --profiles .proof-trusted/.proof/profiles.yaml \
            --catalog .proof-trusted/.proof/control-catalog.yaml \
            --providers .proof-trusted/.proof/providers.yaml \
            --trusted-base-revision "${TRUSTED_BASE_REVISION}" \
            --trusted-workflow-ref "${TRUSTED_WORKFLOW_REF}" \
            "${collector_args[@]}" \
            --output "${EVIDENCE_JSON}"
          cp "${EVIDENCE_JSON}" .artifacts/proof/evidence.json
      - name: Collect optional artifact and verification-environment evidence
        if: ${{ github.event.pull_request != null && vars.PROOF_LIFECYCLE_ENABLED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.event.pull_request.head.sha }}
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          collector=.proof-trusted/.proof/collect_lifecycle_evidence.py
          # Runtime adoption must merge before its trusted producer can be used.
          # An older trusted base remains missing; candidate code never replaces it.
          if [ ! -f "${collector}" ]; then
            echo 'The trusted runtime does not yet support lifecycle collection.' >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          python3 "${collector}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pull-request-number "${PULL_REQUEST_NUMBER}" \
            --revision "${REVISION}" \
            --trusted-base-revision "${BASE_REVISION}" \
            --trusted-workflow-ref "refs/heads/${BASE_REF}" \
            --providers .proof-trusted/.proof/providers.yaml \
            --config .proof-trusted/.proof/lifecycle.json \
            --output-dir .artifacts/proof/lifecycle
          echo 'PROOF_LIFECYCLE_EVIDENCE=.artifacts/proof/lifecycle/lifecycle-companions.json' >> "${GITHUB_ENV}"
      - name: Evaluate pull-request metadata
        if: ${{ github.event.pull_request != null }}
        run: |
          set -euo pipefail
          # PR title and body live on the pull-request subject, which a commit
          # scorecard cannot carry. Score them with the trusted base validator.
          if ! python3 .proof-trusted/.proof/scorecard.py --help 2>&1 | \
            grep -q -- "--pull-request-revision"
          then
            exit 0
          fi
          validator=.proof-trusted/.proof/validators/validate_pr_metadata.py
          config=.proof-trusted/.proof/pr-metadata.yaml
          evidence=.artifacts/proof/pr-metadata-evidence.json
          revision=""
          if [ -f "${validator}" ] && [ -f "${config}" ] && \
            revision="$(python3 "${validator}" \
              --event "${GITHUB_EVENT_PATH}" \
              --config "${config}" \
              --output "${evidence}")"
          then
            echo "PROOF_PULL_REQUEST_EVIDENCE=${evidence}" >> "${GITHUB_ENV}"
          else
            # No usable result: the scorecard reports the control as unverified.
            revision=unavailable
            rm -f "${evidence}"
          fi
          echo "PROOF_PULL_REQUEST_REVISION=${revision}" >> "${GITHUB_ENV}"
      - name: Render scorecard
        env:
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          pull_request_args=()
          if [ -n "${PROOF_PULL_REQUEST_REVISION:-}" ]; then
            pull_request_args+=(--pull-request-revision "${PROOF_PULL_REQUEST_REVISION}")
            if [ -n "${PROOF_PULL_REQUEST_EVIDENCE:-}" ]; then
              pull_request_args+=(--pull-request-evidence "${PROOF_PULL_REQUEST_EVIDENCE}")
            fi
          fi
          if [ -n "${PROOF_LIFECYCLE_EVIDENCE:-}" ]; then
            pull_request_args+=(--lifecycle-evidence "${PROOF_LIFECYCLE_EVIDENCE}")
          fi
          EVIDENCE_JSON=".artifacts/proof/evidence-${PROOF_TIMESTAMP}.json"
          SCORECARD_JSON=".artifacts/proof/scorecard-${PROOF_TIMESTAMP}.json"
          SCORECARD_MARKDOWN=".artifacts/proof/scorecard-${PROOF_TIMESTAMP}.md"
          json_status=0
          python3 .proof-trusted/.proof/scorecard.py \
            --policy .proof-trusted/.proof/policy.yaml \
            --profiles .proof-trusted/.proof/profiles.yaml \
            --catalog .proof-trusted/.proof/control-catalog.yaml \
            --providers .proof-trusted/.proof/providers.yaml \
            --evidence "${EVIDENCE_JSON}" \
            --operation change \
            --revision "${REVISION}" \
            --subject-type git-commit \
            --all-catalog-controls \
            "${pull_request_args[@]}" \
            --json \
            > "${SCORECARD_JSON}" || json_status=$?
          markdown_status=0
          python3 .proof-trusted/.proof/scorecard.py \
            --policy .proof-trusted/.proof/policy.yaml \
            --profiles .proof-trusted/.proof/profiles.yaml \
            --catalog .proof-trusted/.proof/control-catalog.yaml \
            --providers .proof-trusted/.proof/providers.yaml \
            --evidence "${EVIDENCE_JSON}" \
            --operation change \
            --revision "${REVISION}" \
            --subject-type git-commit \
            --all-catalog-controls \
            "${pull_request_args[@]}" \
            > "${SCORECARD_MARKDOWN}" || markdown_status=$?
          cat "${SCORECARD_MARKDOWN}" >> "${GITHUB_STEP_SUMMARY}"
          if [ "${json_status}" -ne 0 ]; then
            exit "${json_status}"
          fi
          exit "${markdown_status}"
      - name: Upload scorecard evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: proof-scorecard-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/proof/source.json
            .artifacts/proof/scorecard-*.json
            .artifacts/proof/scorecard-*.md
          if-no-files-found: error
