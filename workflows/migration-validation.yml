# Guardrails v2 installer-owned workflow.
name: Migration Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: migration-validation-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migration-validation:
    name: Migration Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require configured command
        run: |
          if [[ -z "${GUARDRAILS_MIGRATION_VALIDATION_COMMAND}" ]]; then
            echo "::error::GUARDRAILS_MIGRATION_VALIDATION_COMMAND is not configured"
            exit 1
          fi
        env:
          GUARDRAILS_MIGRATION_VALIDATION_COMMAND: ${{ vars.GUARDRAILS_MIGRATION_VALIDATION_COMMAND }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup repository
        if: ${{ vars.GUARDRAILS_SETUP_COMMAND != '' }}
        working-directory: ${{ vars.GUARDRAILS_WORKING_DIRECTORY || '.' }}
        run: bash -euo pipefail -c "${GUARDRAILS_SETUP_COMMAND}"
        env:
          GUARDRAILS_SETUP_COMMAND: ${{ vars.GUARDRAILS_SETUP_COMMAND }}
      - name: Validate migrations
        working-directory: ${{ vars.GUARDRAILS_WORKING_DIRECTORY || '.' }}
        run: bash -euo pipefail -c "${GUARDRAILS_MIGRATION_VALIDATION_COMMAND}"
        env:
          GUARDRAILS_MIGRATION_VALIDATION_COMMAND: ${{ vars.GUARDRAILS_MIGRATION_VALIDATION_COMMAND }}
