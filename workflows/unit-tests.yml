# Proof installer-owned workflow.
name: Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fetch source history for skill verification
        if: ${{ hashFiles('tooling/validate-skills.py') != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup repository
        run: python3 .proof/run_repository_command.py --command unit-tests --phase setup
        env:
          PROOF_SETUP_COMMAND: ${{ vars.PROOF_SETUP_COMMAND }}
          PROOF_UNIT_TEST_COMMAND: ${{ vars.PROOF_UNIT_TEST_COMMAND }}
          PROOF_WORKING_DIRECTORY: ${{ vars.PROOF_WORKING_DIRECTORY }}
      - name: Unit tests
        id: tests
        run: python3 .proof/run_repository_command.py --command unit-tests --phase producer
        env:
          PROOF_UNIT_TEST_COMMAND: ${{ vars.PROOF_UNIT_TEST_COMMAND }}
          PROOF_WORKING_DIRECTORY: ${{ vars.PROOF_WORKING_DIRECTORY }}
          PROOF_MEASUREMENTS_FILE: ${{ runner.temp }}/proof-measurements-input.json
      # Optional, self-reported display metrics: never changes this check's result.
      - name: Package self-reported measurements
        id: measurements
        if: ${{ always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OUTCOME: ${{ steps.tests.outcome }}
        run: |
          input="${RUNNER_TEMP}/proof-measurements-input.json"
          if [[ ! -f "${input}" ]]; then
            echo "No measurements file was written; the scorecard will show measurements as not collected."
            exit 0
          fi
          if python3 .proof/measurements.py package --control unit-tests --input "${input}" \
              --outcome "${OUTCOME}" --head-sha "${HEAD_SHA}" --output "${RUNNER_TEMP}/proof-measurements/proof-measurements.json"; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::Measurements were not packaged; the check result is unaffected."
          fi
      - name: Upload self-reported measurements
        if: ${{ always() && steps.measurements.outputs.present == 'true' }}
        # Optional display metadata: an upload failure must not change the check result.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: proof-measurements-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof-measurements/proof-measurements.json
          if-no-files-found: error
          retention-days: 7
