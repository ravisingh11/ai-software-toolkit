name: Soak Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  workflow_call:
    inputs:
      soak-command:
        description: Repository-owned soak or endurance-test command.
        required: false
        type: string
        default: ''
      working-directory:
        description: Directory in which the soak command runs.
        required: false
        type: string
        default: '.'

concurrency:
  group: soak-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  soak:
    name: Soak Check
    if: ${{ inputs.soak-command != '' || vars.SOAK_COMMAND != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SOAK_COMMAND: ${{ inputs.soak-command || vars.SOAK_COMMAND }}
      WORKING_DIRECTORY: ${{ inputs.working-directory || vars.SOAK_WORKING_DIRECTORY || '.' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run repository soak check
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SOAK_COMMAND}" ]]; then
            echo "Configure SOAK_COMMAND or workflow_call input soak-command." >&2
            exit 1
          fi
          bash -euo pipefail -c "${SOAK_COMMAND}"

# The command must report duration, workload, resource observations, thresholds,
# and the exact revision in the evidence consumed by the Proof evaluator.
# This template does not invent a universal soak-test implementation.
