name: SonarQube

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      project-base-directory:
        description: Directory passed to the SonarQube scanner.
        required: false
        type: string
        default: '.'
      sonar-args:
        description: Optional repository-specific SonarQube scanner arguments.
        required: false
        type: string
        default: ''
    secrets:
      SONAR_TOKEN:
        description: SonarQube or SonarQube Cloud authentication token.
        required: true

permissions:
  contents: read

jobs:
  sonar:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ARGS: ${{ inputs.sonar-args || vars.SONAR_ARGS }}
      PROJECT_BASE_DIRECTORY: ${{ inputs.project-base-directory || vars.SONAR_PROJECT_BASE_DIRECTORY || '.' }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out repository with history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate SonarQube configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SONAR_TOKEN}" ]]; then
            echo "The SONAR_TOKEN secret must be configured in the consuming repository or organization." >&2
            exit 1
          fi
          if [[ -z "${SONAR_PROJECT_KEY}" && ! -f "${PROJECT_BASE_DIRECTORY}/sonar-project.properties" ]]; then
            echo "Configure SONAR_PROJECT_KEY or provide sonar-project.properties." >&2
            exit 1
          fi

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          projectBaseDir: ${{ env.PROJECT_BASE_DIRECTORY }}
          args: ${{ env.SONAR_ARGS }}
        env:
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ env.SONAR_PROJECT_KEY }}

      - name: Check SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 10
        env:
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
