name: Security Scanning

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      codeql-languages:
        description: Comma-separated CodeQL language identifiers configured by the consuming repository.
        required: false
        type: string
        default: ''
      codeql-build-mode:
        description: Use autobuild for compiled languages when appropriate; otherwise use none.
        required: false
        type: string
        default: none
      dependency-fail-on-severity:
        description: Dependency Review severity threshold.
        required: false
        type: string
        default: high
      semgrep-command:
        description: Optional organization-owned Semgrep command. Empty means not configured.
        required: false
        type: string
        default: ''
      secret-scan-command:
        description: Optional organization-owned secret scanning command. GitHub platform scanning is configured separately.
        required: false
        type: string
        default: ''

concurrency:
  group: security-scanning-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      CODEQL_LANGUAGES: ${{ inputs.codeql-languages || vars.CODEQL_LANGUAGES }}
      CODEQL_BUILD_MODE: ${{ inputs.codeql-build-mode || vars.CODEQL_BUILD_MODE || 'none' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate CodeQL configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CODEQL_LANGUAGES}" ]]; then
            echo "Configure CODEQL_LANGUAGES or workflow_call input codeql-languages." >&2
            exit 1
          fi
          case "${CODEQL_BUILD_MODE}" in
            none|autobuild) ;;
            *) echo "CODEQL_BUILD_MODE must be none or autobuild." >&2; exit 1 ;;
          esac

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ env.CODEQL_LANGUAGES }}
          build-mode: ${{ env.CODEQL_BUILD_MODE }}

      - name: Autobuild compiled languages
        if: ${{ env.CODEQL_BUILD_MODE == 'autobuild' }}
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ env.CODEQL_LANGUAGES }}

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    env:
      DEPENDENCY_FAIL_ON_SEVERITY: ${{ inputs.dependency-fail-on-severity || vars.DEPENDENCY_FAIL_ON_SEVERITY || 'high' }}
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: ${{ env.DEPENDENCY_FAIL_ON_SEVERITY }}

  semgrep:
    name: Semgrep
    if: ${{ inputs.semgrep-command != '' || vars.SEMGREP_COMMAND != '' }}
    runs-on: ubuntu-latest
    env:
      SEMGREP_COMMAND: ${{ inputs.semgrep-command || vars.SEMGREP_COMMAND }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Run organization Semgrep integration
        shell: bash
        run: bash -euo pipefail -c "${SEMGREP_COMMAND}"

  secret-scan:
    name: Secret Scan
    if: ${{ inputs.secret-scan-command != '' || vars.SECRET_SCAN_COMMAND != '' }}
    runs-on: ubuntu-latest
    env:
      SECRET_SCAN_COMMAND: ${{ inputs.secret-scan-command || vars.SECRET_SCAN_COMMAND }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Run organization secret scanner
        shell: bash
        run: bash -euo pipefail -c "${SECRET_SCAN_COMMAND}"

# FOSSA and Snyk Open Source are not part of this bundle. Its jobs check out
# and run pull-request code on `pull_request`, so any provider credential here
# would be readable by that code. Copy the adapter templates `fossa.yml` and
# `snyk.yml` instead; see docs/providers/README.md.
#
# GitHub secret scanning and push protection are platform settings, not Actions
# steps. Enable them at the organization/repository level; this workflow does
# not pretend to configure them.
