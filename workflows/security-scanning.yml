name: Security Scanning

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      codeql-languages:
        description: Comma-separated CodeQL language identifiers configured by the consuming repository.
        required: false
        type: string
        default: ''
      codeql-build-mode:
        description: Use autobuild for compiled languages when appropriate; otherwise use none.
        required: false
        type: string
        default: none
      dependency-fail-on-severity:
        description: Dependency Review severity threshold.
        required: false
        type: string
        default: high
      semgrep-command:
        description: Optional organization-owned Semgrep command. Empty means not configured.
        required: false
        type: string
        default: ''
      fossa-command:
        description: Optional organization-owned FOSSA command. Empty means not configured.
        required: false
        type: string
        default: ''
      snyk-open-source-command:
        description: Optional Snyk Open Source command. Empty means not configured.
        required: false
        type: string
        default: ''
      secret-scan-command:
        description: Optional organization-owned secret scanning command. GitHub platform scanning is configured separately.
        required: false
        type: string
        default: ''
    secrets:
      FOSSA_API_KEY:
        description: Optional FOSSA API key consumed by the repository-owned adapter.
        required: false
      SNYK_TOKEN:
        description: Snyk API token consumed by the repository-owned Snyk adapter.
        required: false

concurrency:
  group: security-scanning-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      CODEQL_LANGUAGES: ${{ inputs.codeql-languages || vars.CODEQL_LANGUAGES }}
      CODEQL_BUILD_MODE: ${{ inputs.codeql-build-mode || vars.CODEQL_BUILD_MODE || 'none' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate CodeQL configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CODEQL_LANGUAGES}" ]]; then
            echo "Configure CODEQL_LANGUAGES or workflow_call input codeql-languages." >&2
            exit 1
          fi
          case "${CODEQL_BUILD_MODE}" in
            none|autobuild) ;;
            *) echo "CODEQL_BUILD_MODE must be none or autobuild." >&2; exit 1 ;;
          esac

      - name: Initialize CodeQL
        uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          languages: ${{ env.CODEQL_LANGUAGES }}
          build-mode: ${{ env.CODEQL_BUILD_MODE }}

      - name: Autobuild compiled languages
        if: ${{ env.CODEQL_BUILD_MODE == 'autobuild' }}
        uses: github/codeql-action/autobuild@42947a340483f03ba47bb1a039b2c519aab3df85 # v3

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          category: /language:${{ env.CODEQL_LANGUAGES }}

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    env:
      DEPENDENCY_FAIL_ON_SEVERITY: ${{ inputs.dependency-fail-on-severity || vars.DEPENDENCY_FAIL_ON_SEVERITY || 'high' }}
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@6d786de4d6f3531a740e445b53a42b622bbbace8 # v4
        with:
          fail-on-severity: ${{ env.DEPENDENCY_FAIL_ON_SEVERITY }}

  semgrep:
    name: Semgrep
    if: ${{ inputs.semgrep-command != '' || vars.SEMGREP_COMMAND != '' }}
    runs-on: ubuntu-latest
    env:
      SEMGREP_COMMAND: ${{ inputs.semgrep-command || vars.SEMGREP_COMMAND }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Run organization Semgrep integration
        shell: bash
        run: bash -euo pipefail -c "${SEMGREP_COMMAND}"

  fossa:
    name: FOSSA
    if: ${{ inputs.fossa-command != '' || vars.FOSSA_COMMAND != '' }}
    runs-on: ubuntu-latest
    env:
      FOSSA_COMMAND: ${{ inputs.fossa-command || vars.FOSSA_COMMAND }}
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Run organization FOSSA integration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${FOSSA_API_KEY}" ]]; then
            echo "Configure FOSSA_API_KEY or use an organization-managed FOSSA integration." >&2
            exit 1
          fi
          bash -euo pipefail -c "${FOSSA_COMMAND}"

  snyk-open-source:
    name: Snyk Open Source
    if: ${{ inputs.snyk-open-source-command != '' || vars.SNYK_OPEN_SOURCE_COMMAND != '' }}
    runs-on: ubuntu-latest
    env:
      SNYK_OPEN_SOURCE_COMMAND: ${{ inputs.snyk-open-source-command || vars.SNYK_OPEN_SOURCE_COMMAND }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
      - name: Run Snyk Open Source scan
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SNYK_TOKEN}" ]]; then
            echo "Configure SNYK_TOKEN or use an organization-managed Snyk integration." >&2
            exit 1
          fi
          bash -euo pipefail -c "${SNYK_OPEN_SOURCE_COMMAND}"

  secret-scan:
    name: Secret Scan
    if: ${{ inputs.secret-scan-command != '' || vars.SECRET_SCAN_COMMAND != '' }}
    runs-on: ubuntu-latest
    env:
      SECRET_SCAN_COMMAND: ${{ inputs.secret-scan-command || vars.SECRET_SCAN_COMMAND }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Run organization secret scanner
        shell: bash
        run: bash -euo pipefail -c "${SECRET_SCAN_COMMAND}"

# GitHub secret scanning and push protection are platform settings, not Actions
# steps. Enable them at the organization/repository level; this workflow does
# not pretend to configure them.
